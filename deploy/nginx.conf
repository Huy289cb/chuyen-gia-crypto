# Nginx Configuration for Crypto Analyzer Backend
# 
# This configuration proxies HTTP requests only to the API process.
# The worker process has no public port and is not exposed.
# 
# Deploy to: /etc/nginx/sites-available/crypto-analyzer
# Enable with: ln -s /etc/nginx/sites-available/crypto-analyzer /etc/nginx/sites-enabled/
# Test with: nginx -t
# Reload with: systemctl reload nginx

upstream crypto_api {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com;  # Replace with your actual domain

    # Redirect HTTP to HTTPS (uncomment after SSL is configured)
    # return 301 https://$server_name$request_uri;

    # Logging
    access_log /var/log/nginx/crypto-analyzer-access.log;
    error_log /var/log/nginx/crypto-analyzer-error.log;

    # Client body size limit (for large requests if needed)
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # API routes
    location / {
        proxy_pass http://crypto_api;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://crypto_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

